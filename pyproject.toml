[project]
name = "archsim"
version = "0.1.0"
description = "Discrete-event simulator for event-driven backend architectures"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archsim = "archsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
